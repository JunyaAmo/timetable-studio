<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b111b" />
  <title>TIMETABLE STUDIO</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="display" id="display">
    <canvas id="ambient" aria-hidden="true"></canvas>
    <header class="header">
      <div class="brand"><img id="brand-logo" src="./assets/logo.svg" alt="" /><div><div class="brand-title" id="brand-title">STUDIO / 01</div><div class="brand-subtitle">TIMETABLE STUDIO</div></div></div>
      <div class="date" id="date">—</div>
    </header>
    <section class="hero" aria-live="off">
      <div class="hero-status" id="status">—</div>
      <h1 class="hero-title" id="headline">—</h1>
      <div class="hero-value" id="value">—</div>
      <div class="hero-detail" id="detail">—</div>
      <div class="progress" id="hero-progress"><div id="progress-fill"></div></div>
    </section>
    <section class="footer">
      <div class="timeline-top"><div class="eyebrow">TODAY'S TIMELINE <span id="event-count"></span></div><div class="time-small" id="mini-clock">—</div></div>
      <div class="timeline" id="timeline" aria-label="1日の予定"></div>
      <div class="footer-bottom"><span id="timeline-caption"></span><span>PRESS <kbd>F</kbd> FOR FULLSCREEN</span></div>
    </section>
    <button class="full-screen" id="fullscreen" aria-label="全画面表示にする" title="全画面表示 (F)">⛶</button>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
