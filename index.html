
<!doctype html>
<html lang="ja">

<head>

    <!-- ========================================================
         01. ページ基本設定
    ======================================================== -->

    <!-- 文字コード -->
    <meta charset="utf-8" />

    <!-- 画面サイズへの対応 -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <!-- ブラウザのテーマカラー -->
    <meta
        name="theme-color"
        content="#0b111b"
    />

    <!-- ページタイトル -->
    <title>TIMETABLE STUDIO</title>

    <!-- CSS読み込み -->
    <link
        rel="stylesheet"
        href="./css/style.css"
    />

</head>

<body>

    <!-- ========================================================
         02. メインディスプレイ
    ======================================================== -->

    <main
        class="display"
        id="display"
    >

        <!-- ====================================================
             03. 背景アニメーション
        ==================================================== -->

        <!-- Canvasによる粒子アニメーション -->
        <canvas
            id="ambient"
            aria-hidden="true"
        ></canvas>


        <!-- ====================================================
             04. ヘッダー
        ==================================================== -->

        <header class="header">

            <!-- チームロゴ・ブランド名 -->
            <div class="brand">

                <!-- チームロゴ -->
                <img
                    id="brand-logo"
                    src="./assets/logo.svg"
                    alt=""
                />

                <!-- ブランド情報 -->
                <div>

                    <!-- チーム名 -->
                    <div
                        class="brand-title"
                        id="brand-title"
                    >
                        STUDIO / 01
                    </div>

                    <!-- サブタイトル -->
                    <div class="brand-subtitle">
                        TIMETABLE STUDIO
                    </div>

                </div>

            </div>


            <!-- 今日の日付 -->
            <div
                class="date"
                id="date"
            >
                —
            </div>

        </header>


        <!-- ====================================================
             05. 中央表示エリア
        ==================================================== -->

        <section
            class="hero"
            aria-live="off"
        >

            <!-- 現在の状態 -->
            <!-- IN PROGRESS / FREE TIME -->
            <div
                class="hero-status"
                id="status"
            >
                —
            </div>


            <!-- 現在の予定名 -->
            <!-- 空き時間は「次の予定まで」などを表示 -->
            <h1
                class="hero-title"
                id="headline"
            >
                —
            </h1>


            <!-- 残り時間・現在時刻 -->
            <div
                class="hero-value"
                id="value"
            >
                —
            </div>


            <!-- 開始終了時刻・次の予定 -->
            <div
                class="hero-detail"
                id="detail"
            >
                —
            </div>


            <!-- =================================================
                 06. 進捗バー
            ================================================= -->

            <div
                class="progress"
                id="hero-progress"
            >

                <!-- 進捗部分 -->
                <div id="progress-fill"></div>

            </div>

        </section>


        <!-- ====================================================
             07. タイムライン
        ==================================================== -->

        <section class="footer">

            <!-- タイムライン上部 -->
            <div class="timeline-top">

                <!-- タイトル・予定数 -->
                <div class="eyebrow">

                    TODAY'S TIMELINE

                    <span id="event-count"></span>

                </div>


                <!-- 小さい現在時刻 -->
                <div
                    class="time-small"
                    id="mini-clock"
                >
                    —
                </div>

            </div>


            <!-- =================================================
                 08. 横型タイムライン本体
            ================================================= -->

            <!--
                app.js が予定データを読み込み、
                この要素の中に予定・空き時間を生成する。

                空き時間が長い場合は表示幅を圧縮する。
            -->

            <div
                class="timeline"
                id="timeline"
                aria-label="1日の予定"
            ></div>


            <!-- =================================================
                 09. タイムライン下部
            ================================================= -->

            <div class="footer-bottom">

                <!-- 現在の状態や次の予定 -->
                <span id="timeline-caption"></span>


                <!-- フルスクリーン操作の説明 -->
                <span>

                    PRESS

                    <kbd>F</kbd>

                    FOR FULLSCREEN

                </span>

            </div>

        </section>


        <!-- ====================================================
             10. フルスクリーンボタン
        ==================================================== -->

        <button
            class="full-screen"
            id="fullscreen"
            aria-label="全画面表示にする"
            title="全画面表示 (F)"
        >
            ⛶
        </button>

    </main>


    <!-- ========================================================
         11. JavaScript読み込み
    ======================================================== -->

    <!--
        type="module" を指定することで、
        app.js から config.js を import できる。
    -->

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
